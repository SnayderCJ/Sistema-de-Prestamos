<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheques Empresariales - ImaxPrestamos</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <!-- Header Component -->
    <div data-component="header"></div>

    <div class="main-layout">
        <!-- Sidebar Component -->
        <div data-component="sidebar"></div>

        <main class="main-content" role="main">
            <div class="page-header">
                <h1>Cheques Empresariales</h1>
                <button class="btn btn-primary" onclick="abrirModalCheque()">Nuevo Cheque</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Filtros</h2>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Banco</label>
                            <select class="form-control" id="filtroBanco">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select class="form-control" id="filtroEstado">
                                <option value="">Todos</option>
                                <option value="pendiente">Pendiente</option>
                                <option value="cobrado">Cobrado</option>
                                <option value="anulado">Anulado</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>&nbsp;</label>
                            <button class="btn btn-primary" onclick="cargarCheques()">Buscar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Cheques Registrados</h2>
                </div>
                <div class="table-responsive">
                    <table class="table" id="tablaCheques">
                        <thead>
                            <tr>
                                <th>Número</th>
                                <th>Banco</th>
                                <th>Cuenta</th>
                                <th>Beneficiario</th>
                                <th>Monto</th>
                                <th>Fecha Emisión</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="8" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Cheque -->
    <div class="modal" id="modalCheque">
        <div class="modal-backdrop" onclick="cerrarModalCheque()"></div>
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>Nuevo Cheque Empresarial</h3>
                <button class="modal-close" onclick="cerrarModalCheque()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formCheque" onsubmit="crearCheque(event)">
                    <div class="form-group">
                        <label>Banco *</label>
                        <select class="form-control" id="bancoCheque" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Número de Cuenta *</label>
                        <input type="text" class="form-control" id="numeroCuenta" required>
                    </div>

                    <div class="form-group">
                        <label>Número de Cheque *</label>
                        <input type="text" class="form-control" id="numeroCheque" required>
                    </div>

                    <div class="form-group">
                        <label>Beneficiario *</label>
                        <input type="text" class="form-control" id="beneficiario" required>
                    </div>

                    <div class="form-group">
                        <label>Monto *</label>
                        <input type="number" class="form-control" id="montoCheque" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label>Fecha de Emisión *</label>
                        <input type="date" class="form-control" id="fechaEmision" required>
                    </div>

                    <div class="form-group">
                        <label>Concepto</label>
                        <textarea class="form-control" id="conceptoCheque" rows="3"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalCheque()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/cheques-empresariales.js"></script>
</body>
</html>
