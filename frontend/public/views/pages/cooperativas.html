<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperativas - ERP Multicajas</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <!-- Header -->
    <!-- Header Component -->
    <div data-component="header"></div>

    <div class="main-layout">
        <!-- Sidebar Component -->
        <div data-component="sidebar"></div>

        <main class="main-content" role="main">
            <div class="page-header">
                <h1>🤝 Gestión de Cooperativas</h1>
                <button class="btn btn-primary" onclick="abrirModalCooperativa()">
                    ➕ Nueva Cooperativa
                </button>
            </div>

            <!-- Filtros -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <label>Buscar</label>
                            <input type="text" id="filtroBuscar" class="form-control" placeholder="Nombre, RNC..." onkeyup="filtrarCooperativas()">
                        </div>
                        <div class="col-md-3">
                            <label>Estado</label>
                            <select id="filtroActiva" class="form-control" onchange="filtrarCooperativas()">
                                <option value="">Todas</option>
                                <option value="1">Activas</option>
                                <option value="0">Inactivas</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de Cooperativas -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>RNC</th>
                                    <th>Socios</th>
                                    <th>Total Apartaciones</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCooperativas">
                                <tr>
                                    <td colspan="6" class="text-center">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Cooperativa -->
    <div id="modalCooperativa" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalCooperativaTitulo">Nueva Cooperativa</h2>
                <span class="close" onclick="cerrarModal('modalCooperativa')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="formCooperativa">
                    <input type="hidden" id="cooperativaId">
                    
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>RNC</label>
                        <input type="text" id="rnc" class="form-control" maxlength="11">
                    </div>
                    
                    <div class="form-group">
                        <label>Dirección</label>
                        <textarea id="direccion" class="form-control" rows="2"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Teléfono</label>
                                <input type="text" id="telefono" class="form-control">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="email" class="form-control">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Fecha de Constitución</label>
                        <input type="date" id="fechaConstitucion" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="activa" checked> Activa
                        </label>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalCooperativa')">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/cooperativas.js"></script>
</body>
</html>
