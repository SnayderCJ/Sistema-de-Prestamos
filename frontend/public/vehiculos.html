<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos - ImaxPrestamos</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <!-- Header -->
    <!-- Header Component -->
    <div data-component="header"></div>

    <div class="main-layout">
        <!-- Sidebar -->
        <!-- Sidebar Component -->
        <div data-component="sidebar"></div>

        <!-- Main Content -->
        <main class="main-content" role="main">
            <div class="page-header">
                <h1>Vehículos</h1>
                <button class="btn btn-primary" onclick="abrirModalCrearVehiculo()">Nuevo Vehículo</button>
            </div>

            <!-- Filtros -->
            <div class="filters-bar">
                <input type="text" id="buscarVehiculo" class="form-control" placeholder="Buscar por placa, marca, modelo..." onkeyup="filtrarVehiculos()">
                <select id="filtroEstado" class="form-control" onchange="cargarVehiculos()">
                    <option value="">Todos los estados</option>
                    <option value="disponible">Disponible</option>
                    <option value="financiado">Financiado</option>
                    <option value="incautado">Incautado</option>
                </select>
            </div>

            <!-- Tabla de Vehículos -->
            <div class="table-responsive">
                <table class="table" id="tablaVehiculos">
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Año</th>
                            <th>Color</th>
                            <th>Chasis</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="8" class="text-center">
                                <div class="loading">
                                    <div class="loading-spinner"></div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <div class="pagination" id="paginacionVehiculos"></div>
        </main>
    </div>

    <!-- Modal Crear/Editar Vehículo -->
    <div class="modal" id="modalVehiculo">
        <div class="modal-backdrop" onclick="cerrarModal('modalVehiculo')"></div>
        <div class="modal-dialog modal-lg">
            <div class="modal-header">
                <h3 class="modal-title" id="modalVehiculoTitulo">Nuevo Vehículo</h3>
                <button class="modal-close" onclick="cerrarModal('modalVehiculo')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formVehiculo" onsubmit="guardarVehiculo(event)">
                    <input type="hidden" id="vehiculoId">
                    
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Placa *</label>
                            <input type="text" id="vehiculoPlaca" class="form-control" required maxlength="10">
                        </div>
                        
                        <div class="form-group">
                            <label>Marca *</label>
                            <input type="text" id="vehiculoMarca" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Modelo *</label>
                            <input type="text" id="vehiculoModelo" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Año *</label>
                            <input type="number" id="vehiculoAno" class="form-control" required min="1900" max="2100">
                        </div>
                        
                        <div class="form-group">
                            <label>Color</label>
                            <input type="text" id="vehiculoColor" class="form-control">
                        </div>
                        
                        <div class="form-group">
                            <label>Número de Chasis *</label>
                            <input type="text" id="vehiculoChasis" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Número de Motor</label>
                            <input type="text" id="vehiculoMotor" class="form-control">
                        </div>
                        
                        <div class="form-group">
                            <label>Valor Comercial</label>
                            <input type="number" id="vehiculoValor" class="form-control" step="0.01" min="0">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="vehiculoEstado" class="form-control">
                            <option value="disponible">Disponible</option>
                            <option value="financiado">Financiado</option>
                            <option value="incautado">Incautado</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Observaciones</label>
                        <textarea id="vehiculoObservaciones" class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalVehiculo')">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Detalle Vehículo -->
    <div class="modal" id="modalDetalleVehiculo">
        <div class="modal-backdrop" onclick="cerrarModal('modalDetalleVehiculo')"></div>
        <div class="modal-dialog modal-lg">
            <div class="modal-header">
                <h3 class="modal-title">Detalle de Vehículo</h3>
                <button class="modal-close" onclick="cerrarModal('modalDetalleVehiculo')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="grid grid-2">
                    <div>
                        <h4>Información Básica</h4>
                        <table class="table">
                            <tr>
                                <th>Placa:</th>
                                <td id="detalleVehiculoPlaca">-</td>
                            </tr>
                            <tr>
                                <th>Marca:</th>
                                <td id="detalleVehiculoMarca">-</td>
                            </tr>
                            <tr>
                                <th>Modelo:</th>
                                <td id="detalleVehiculoModelo">-</td>
                            </tr>
                            <tr>
                                <th>Año:</th>
                                <td id="detalleVehiculoAno">-</td>
                            </tr>
                            <tr>
                                <th>Color:</th>
                                <td id="detalleVehiculoColor">-</td>
                            </tr>
                        </table>
                    </div>
                    <div>
                        <h4>Información Técnica</h4>
                        <table class="table">
                            <tr>
                                <th>Chasis:</th>
                                <td id="detalleVehiculoChasis">-</td>
                            </tr>
                            <tr>
                                <th>Motor:</th>
                                <td id="detalleVehiculoMotor">-</td>
                            </tr>
                            <tr>
                                <th>Valor Comercial:</th>
                                <td id="detalleVehiculoValor">-</td>
                            </tr>
                            <tr>
                                <th>Estado:</th>
                                <td><span id="detalleVehiculoEstado" class="badge">-</span></td>
                            </tr>
                        </table>
                    </div>
                </div>
                
                <div class="mt-3">
                    <h4>Observaciones</h4>
                    <p id="detalleVehiculoObservaciones">-</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="editarVehiculoDesdeDetalle()">Editar</button>
                <button class="btn btn-secondary" onclick="cerrarModal('modalDetalleVehiculo')">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/vehiculos.js"></script>
</body>
</html>
