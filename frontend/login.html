<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ImaxPrestamos</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="login">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-header-logo">💰 ImaxPrestamos</div>
                    <h1 class="login-header-title">Bienvenido</h1>
                    <p class="login-header-subtitle">Inicia sesión para continuar</p>
                </div>
                
                <form id="loginForm" class="login-form" novalidate>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            autocomplete="email"
                            aria-required="true"
                            aria-describedby="email-error"
                        >
                        <span class="error-message" id="email-error" role="alert"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            autocomplete="current-password"
                            aria-required="true"
                            aria-describedby="password-error"
                        >
                        <span class="error-message" id="password-error" role="alert"></span>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember" name="remember">
                            <span>Recordar sesión</span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
                </form>
                
                <div class="login-footer">
                    <p>¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
                    <p><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
