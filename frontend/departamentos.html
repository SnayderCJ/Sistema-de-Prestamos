<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamentos - ImaxPrestamos</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header Component -->
    <div data-component="header"></div>

    <div class="main-layout">
        <!-- Sidebar Component -->
        <div data-component="sidebar"></div>

        <main class="main-content" role="main">
            <div class="page-header">
                <h1>Departamentos</h1>
                <button class="btn btn-primary" onclick="abrirModalDepartamento()">Nuevo Departamento</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Listado de Departamentos</h2>
                </div>
                <div class="table-responsive">
                    <table class="table" id="tablaDepartamentos">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Empleados</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="5" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Departamento -->
    <div class="modal" id="modalDepartamento">
        <div class="modal-backdrop" onclick="cerrarModalDepartamento()"></div>
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 id="tituloModalDepartamento">Nuevo Departamento</h3>
                <button class="modal-close" onclick="cerrarModalDepartamento()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formDepartamento" onsubmit="guardarDepartamento(event)">
                    <input type="hidden" id="departamentoId">
                    
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" class="form-control" id="nombreDepartamento" required>
                    </div>

                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea class="form-control" id="descripcionDepartamento" rows="3"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalDepartamento()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/departamentos.js"></script>
</body>
</html>
