<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancos - ImaxPrestamos</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header Component -->
    <div data-component="header"></div>

    <div class="main-layout">
        <!-- Sidebar Component -->
        <div data-component="sidebar"></div>

        <main class="main-content" role="main">
            <div class="page-header">
                <h1>Bancos</h1>
                <button class="btn btn-primary" onclick="abrirModalBanco()">Nuevo Banco</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Listado de Bancos</h2>
                    <input type="text" class="form-control" id="buscarBanco" placeholder="Buscar..." onkeyup="filtrarBancos()">
                </div>
                <div class="table-responsive">
                    <table class="table" id="tablaBancos">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>SWIFT</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="5" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Banco -->
    <div class="modal" id="modalBanco">
        <div class="modal-backdrop" onclick="cerrarModalBanco()"></div>
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 id="tituloModalBanco">Nuevo Banco</h3>
                <button class="modal-close" onclick="cerrarModalBanco()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formBanco" onsubmit="guardarBanco(event)">
                    <input type="hidden" id="bancoId">
                    
                    <div class="form-group">
                        <label>Código *</label>
                        <input type="text" class="form-control" id="codigoBanco" required>
                    </div>

                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" class="form-control" id="nombreBanco" required>
                    </div>

                    <div class="form-group">
                        <label>Código SWIFT</label>
                        <input type="text" class="form-control" id="swiftBanco">
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalBanco()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/bancos.js"></script>
</body>
</html>
