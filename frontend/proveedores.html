<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - ImaxPrestamos</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header -->
    <!-- Header Component -->
    <div data-component="header"></div>

    <div class="main-layout">
        <!-- Sidebar -->
        <!-- Sidebar Component -->
        <div data-component="sidebar"></div>

        <!-- Main Content -->
        <main class="main-content" role="main">
            <div class="page-header">
                <h1>Proveedores</h1>
                <button class="btn btn-primary" onclick="abrirModalCrear()">+ Nuevo Proveedor</button>
            </div>

            <!-- Filtros -->
            <div class="filters-bar">
                <input type="text" id="buscarProveedor" class="form-control" placeholder="Buscar por nombre, cédula o RNC..." onkeyup="filtrarProveedores()">
                <select id="filtroEstado" class="form-control" onchange="filtrarProveedores()">
                    <option value="">Todos los estados</option>
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>

            <!-- Tabla de Proveedores -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table" id="tablaProveedores">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Cédula/RNC</th>
                                    <th>Teléfono</th>
                                    <th>Email</th>
                                    <th>Compras</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyProveedores">
                                <tr>
                                    <td colspan="7" class="text-center">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Crear/Editar Proveedor -->
    <div id="modalProveedor" class="modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitulo">Nuevo Proveedor</h3>
                    <button class="btn-close" onclick="cerrarModal('modalProveedor')">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="formProveedor">
                        <input type="hidden" id="proveedorId">
                        
                        <div class="form-group">
                            <label for="nombre">Nombre *</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="cedula">Cédula</label>
                                <input type="text" id="cedula" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="rnc">RNC</label>
                                <input type="text" id="rnc" class="form-control">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="telefono">Teléfono</label>
                                <input type="tel" id="telefono" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="direccion">Dirección</label>
                            <textarea id="direccion" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="contacto">Contacto</label>
                            <input type="text" id="contacto" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <select id="estado" class="form-control">
                                <option value="activo">Activo</option>
                                <option value="inactivo">Inactivo</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalProveedor')">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarProveedor()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/proveedores.js"></script>
</body>
</html>
