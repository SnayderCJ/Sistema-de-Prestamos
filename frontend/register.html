<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ImaxPrestamos</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="login">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-header-logo">💰 ImaxPrestamos</div>
                    <h1 class="login-header-title">Crear Cuenta</h1>
                    <p class="login-header-subtitle">Regístrate para comenzar</p>
                </div>
                
                <form id="registerForm" class="login-form" novalidate>
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input 
                            type="text" 
                            id="nombre" 
                            name="nombre" 
                            required 
                            autocomplete="given-name"
                            aria-required="true"
                            aria-describedby="nombre-error"
                        >
                        <span class="error-message" id="nombre-error" role="alert"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input 
                            type="text" 
                            id="apellido" 
                            name="apellido" 
                            required 
                            autocomplete="family-name"
                            aria-required="true"
                            aria-describedby="apellido-error"
                        >
                        <span class="error-message" id="apellido-error" role="alert"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="cedula">Cédula</label>
                        <input 
                            type="text" 
                            id="cedula" 
                            name="cedula" 
                            required 
                            data-validate="cedula"
                            maxlength="11"
                            aria-required="true"
                            aria-describedby="cedula-error"
                        >
                        <span class="error-message" id="cedula-error" role="alert"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            autocomplete="email"
                            aria-required="true"
                            aria-describedby="email-error"
                        >
                        <span class="error-message" id="email-error" role="alert"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input 
                            type="tel" 
                            id="telefono" 
                            name="telefono" 
                            autocomplete="tel"
                            aria-describedby="telefono-error"
                        >
                        <span class="error-message" id="telefono-error" role="alert"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            autocomplete="new-password"
                            minlength="8"
                            aria-required="true"
                            aria-describedby="password-error"
                        >
                        <span class="error-message" id="password-error" role="alert"></span>
                        <small class="form-help">Mínimo 8 caracteres</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="passwordConfirm">Confirmar Contraseña</label>
                        <input 
                            type="password" 
                            id="passwordConfirm" 
                            name="passwordConfirm" 
                            required 
                            autocomplete="new-password"
                            aria-required="true"
                            aria-describedby="passwordConfirm-error"
                        >
                        <span class="error-message" id="passwordConfirm-error" role="alert"></span>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" name="terms" required aria-required="true">
                            <span>Acepto los <a href="terms.html" target="_blank">términos y condiciones</a></span>
                        </label>
                        <span class="error-message" id="terms-error" role="alert"></span>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
                </form>
                
                <div class="login-footer">
                    <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
