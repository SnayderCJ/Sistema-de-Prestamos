<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías de Artículos - ImaxPrestamos</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header -->
    <!-- Header Component -->
    <div data-component="header"></div>

    <div class="main-layout">
        <!-- Sidebar -->
        <!-- Sidebar Component -->
        <div data-component="sidebar"></div>

        <!-- Main Content -->
        <main class="main-content" role="main">
            <div class="page-header">
                <h1>Categorías de Artículos</h1>
                <button class="btn btn-primary" onclick="abrirModalCrear()">+ Nueva Categoría</button>
            </div>

            <!-- Tabla de Categorías -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table" id="tablaCategorias">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Artículos</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyCategorias">
                                <tr>
                                    <td colspan="5" class="text-center">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Crear/Editar Categoría -->
    <div id="modalCategoria" class="modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitulo">Nueva Categoría</h3>
                    <button class="btn-close" onclick="cerrarModal('modalCategoria')">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="formCategoria">
                        <input type="hidden" id="categoriaId">
                        
                        <div class="form-group">
                            <label for="nombre">Nombre *</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="descripcion">Descripción</label>
                            <textarea id="descripcion" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <select id="estado" class="form-control">
                                <option value="activo">Activo</option>
                                <option value="inactivo">Inactivo</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalCategoria')">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarCategoria()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/categorias-articulos.js"></script>
</body>
</html>
