<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reenganche - ImaxPrestamos</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header Component -->
    <div data-component="header"></div>

    <div class="main-layout">
        <!-- Sidebar Component -->
        <div data-component="sidebar"></div>

        <main class="main-content" role="main">
            <div class="page-header">
                <h1>Reenganche de Préstamos</h1>
                <button class="btn btn-primary" onclick="abrirModalReenganche()">Nuevo Reenganche</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Préstamos Elegibles para Reenganche</h2>
                    <div class="card-actions">
                        <input type="text" class="form-control" id="buscarReenganche" placeholder="Buscar..." onkeyup="filtrarReenganches()">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table" id="tablaReenganches">
                        <thead>
                            <tr>
                                <th>Préstamo</th>
                                <th>Cliente</th>
                                <th>Monto Original</th>
                                <th>Saldo Actual</th>
                                <th>Cuotas Pagadas</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="7" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Reenganche -->
    <div class="modal" id="modalReenganche">
        <div class="modal-backdrop" onclick="cerrarModalReenganche()"></div>
        <div class="modal-dialog modal-lg">
            <div class="modal-header">
                <h3>Nuevo Reenganche</h3>
                <button class="modal-close" onclick="cerrarModalReenganche()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formReenganche" onsubmit="crearReenganche(event)">
                    <input type="hidden" id="prestamoIdReenganche">
                    
                    <div class="form-group">
                        <label>Préstamo Original *</label>
                        <input type="text" class="form-control" id="prestamoOriginal" readonly>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Nuevo Monto *</label>
                            <input type="number" class="form-control" id="nuevoMonto" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Nuevo Plazo (meses) *</label>
                            <input type="number" class="form-control" id="nuevoPlazo" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Tasa de Interés *</label>
                        <select class="form-control" id="tasaInteresReenganche" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Observaciones</label>
                        <textarea class="form-control" id="observacionesReenganche" rows="3"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalReenganche()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Crear Reenganche</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/reenganche.js"></script>
</body>
</html>
